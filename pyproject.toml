[project]
name = "fingerprints"
version = "0.1.0"
description = "Reads a tumour's mutations and explains, in plain English, what most likely caused them."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Prithviraj Dasgupta" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
# COSMIC SBS v3.4 reference signatures come from the copy bundled in SigProfilerAssignment.
# Heavy; not installed in CI.
signatures = ["SigProfilerAssignment==1.1.5"]

[project.scripts]
fingerprints = "fingerprints.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fingerprints"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["fingerprints"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
    "slow: long-running tests (deselect with -m \"not slow\")",
    "network: tests that need internet access (deselected in CI)",
]
